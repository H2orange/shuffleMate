<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Shuffle 管家</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── 顶栏 ───────────────────────────────────────────── -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                d="M9 18V6.8l9-2v10.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="6.6" cy="18" r="2.6" fill="currentColor" />
              <circle cx="15.6" cy="15.2" r="2.6" fill="currentColor" />
            </svg>
          </span>
          <div class="brand-text">
            <h1>Shuffle 管家</h1>
            <p>iPod Shuffle 曲库 · 中文 VoiceOver</p>
          </div>
        </div>

        <div class="device-slot" id="deviceSlot">
          <div class="device-empty" id="deviceEmpty">
            <span class="dot dot-off"></span>
            <span>未检测到设备</span>
            <button class="btn btn-ghost btn-sm" id="btnRefresh">重新检测</button>
          </div>
        </div>
      </header>

      <!-- ── 主体双栏 ───────────────────────────────────────── -->
      <main class="panes">
        <!-- 左：本地待导入 -->
        <section class="pane" id="paneLocal">
          <div class="pane-head">
            <div class="pane-title">
              <h2>本地音乐</h2>
              <span class="count" id="localCount">0</span>
            </div>
            <div class="pane-actions">
              <button class="btn btn-soft btn-sm" id="btnAddFiles">添加文件</button>
              <button class="btn btn-soft btn-sm" id="btnAddFolder">添加文件夹</button>
              <button class="btn btn-ghost btn-sm" id="btnClearLocal" title="清空列表">清空</button>
            </div>
          </div>
          <div class="pane-body" id="localBody">
            <div class="dropzone" id="dropzone">
              <div class="dz-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="26" height="26">
                  <path
                    d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
              <p class="dz-title">拖放音乐文件到这里</p>
              <p class="dz-sub">或点击上方按钮选择</p>
            </div>
            <ul class="list" id="localList"></ul>
          </div>
        </section>

        <!-- 右：设备曲库 -->
        <section class="pane" id="paneDevice">
          <div class="pane-head">
            <div class="pane-title">
              <h2>设备曲目</h2>
              <span class="count" id="deviceCount">0</span>
            </div>
            <div class="pane-actions">
              <div class="search">
                <svg viewBox="0 0 22" width="14" height="14" aria-hidden="true">
                  <circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8" />
                  <path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <input id="search" type="search" placeholder="搜索曲目" />
              </div>
              <button class="btn btn-ghost btn-sm" id="btnSelectAll">全选</button>
              <button class="btn btn-ghost btn-sm" id="btnSelectNone">取消</button>
            </div>
          </div>

          <div class="capacity" id="capacity"></div>

          <div class="pane-body">
            <ul class="list" id="deviceList"></ul>
          </div>
        </section>
      </main>

      <!-- ── 底栏 ───────────────────────────────────────────── -->
      <footer class="actionbar">
        <div class="ab-left">
          <label class="switch" title="为缺少语音的曲目生成中文播报">
            <input type="checkbox" id="optVoiceover" checked />
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-label">生成中文 VoiceOver</span>
          </label>
          <span class="tag" id="voBackend">语音检测中…</span>
          <label class="switch" title="按「标题 + 时长」跳过设备上已存在的曲目">
            <input type="checkbox" id="optSkipDup" checked />
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-label">跳过重复曲目</span>
          </label>
        </div>

        <div class="ab-mid">
          <div class="progress" id="progress" hidden>
            <div class="progress-bar"><span id="progressFill"></span></div>
            <span class="progress-text" id="progressText"></span>
          </div>
          <div class="status" id="status"></div>
        </div>

        <div class="ab-right">
          <button class="btn btn-soft" id="btnEject" disabled>安全弹出</button>
          <button class="btn btn-danger" id="btnRemove" disabled>移除所选</button>
          <button class="btn btn-primary" id="btnWrite" disabled>写入 iPod</button>
        </div>
      </footer>
    </div>

    <!-- ── 结果弹层 ───────────────────────────────────────── -->
    <div class="overlay" id="overlay" hidden>
      <div class="dialog" id="dialog">
        <h3 id="dialogTitle">完成</h3>
        <div class="dialog-body" id="dialogBody"></div>
        <div class="dialog-foot" id="dialogFoot">
          <button class="btn btn-ghost" id="dialogCancel" hidden>取消</button>
          <button class="btn btn-primary" id="dialogOk">好</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
