[package]
name = "shufflemate"
version = "0.1.0"
description = "iPod Shuffle 音乐管理工具"
authors = ["ShuffleMate"]
edition = "2021"

[lib]
name = "shufflemate_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
byteorder = "1.5"
encoding_rs = "0.8"
walkdir = "2.5"
base64 = "0.22"
fs2 = "0.4"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
md5 = "0.7"
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
